# Change these first
owner: lazios # Your GitHub organization or username, where this repository lives
repo: my_upptime # The name of this repository
sites:
  - name: FritzBox Monitor
    url: $SECRET_SITE
    type: globalping
    location: Frankfurt
    ipv6: true
  - name: Google
    url: https://www.google.com
  - name: Hacker News
    url: https://news.ycombinator.com

status-website:
  cname: status.librehost.xyz
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Status
  introTitle: "**Status** — uptime monitoring"
  introMessage: Real-time status of my services, powered by [Upptime](https://upptime.js.org).
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
